name: Terraform Destroy

# Manual, single-environment teardown. Deliberately NOT part of the promotion
# pipeline. Requires selecting the environment and typing its name to confirm.
# The job runs under the matching GitHub Environment, so its approval gate applies.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options: [dev, qa, prod]
      confirm:
        description: 'Type the environment name (dev|qa|prod) to confirm destruction'
        required: true
        default: ''

permissions:
  contents: read

env:
  TF_VERSION: '1.15.6'
  AWS_REGION: us-east-1

concurrency:
  group: terraform-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy (${{ github.event.inputs.environment }})
    # Guard: the typed confirmation must match the chosen environment.
    if: ${{ github.event.inputs.confirm == github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}   # ← approval gate
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var-file="${{ github.event.inputs.environment }}.tfvars" \
            -auto-approve \
            -no-color

      - name: Release state lock on failure
        if: failure() || cancelled()
        run: |
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/iac-multienv/${{ github.event.inputs.environment }}/terraform.tfstate.tflock" || true
